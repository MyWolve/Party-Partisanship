name: Reproducibility
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12.14'
          - os: windows-latest
            python: '3.12.10'
          - os: macos-latest
            python: '3.12.10'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONIOENCODING: utf-8
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-lock.txt
      - run: python reproduce.py --check --repeat
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: success()
        with:
          name: reproduction-${{ matrix.os }}
          path: |
            audit/run_manifest.json
            audit/validation_log.txt
